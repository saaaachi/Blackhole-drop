<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackhole Drop v2.3 - Ad Safety</title>
    <style>
        /* 1. 画面全体のスクロールを完全に禁止し、3段構造にする */
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #1a252f; font-family: sans-serif;
            display: flex; flex-direction: column; /* 上・中・下を並べる */
        }

        /* 2. 広告エリアを「固定」する（ゲーム画面を圧迫させない） */
        .ad-area {
            width: 100%; height: 150px; flex-shrink: 0;
            background: #000; display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        iframe { border: none; width: 100%; height: 100%; }

        /* 3. ゲーム画面エリア（広告に絶対侵入させない聖域） */
        #game-container {
            flex-grow: 1; /* 残りの画面をすべて使う */
            position: relative;
            background: #34495e;
            overflow: hidden;
            touch-action: none;
        }

        canvas { display: block; width: 100%; height: 100%; }

        #ui {
            position: absolute; top: 10px; left: 0; width: 100%;
            text-align: center; color: #ecf0f1; font-size: 24px; font-weight: bold;
            pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); z-index: 20;
        }

        /* 4. メニュー画面（ボタンを少し上に配置して誤タップ防止） */
        #menuScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 50; color: white; padding: 10px;
        }

        #ad-middle-container {
            width: 300px; height: 250px; background: #1a252f; display: none;
            justify-content: center; align-items: center; flex-shrink: 0; margin: 10px 0;
        }

        #menuHeader { text-align: center; }
        .btn-group {
            display: flex; flex-direction: column; align-items: center;
            margin-top: 10px; padding-bottom: 20px; /* 下広告との距離 */
        }

        #goButton {
            padding: 14px 45px; font-size: 22px; background: #3498db; border: none;
            border-radius: 50px; color: white; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px #2980b9; width: 240px; margin-bottom: 12px;
        }
        .link-btn {
            padding: 12px 0; font-size: 16px; background: #9b59b6;
            border: none; border-radius: 50px; color: white; font-weight: bold;
            text-decoration: none; width: 240px; text-align: center;
            box-shadow: 0 4px #8e44ad;
        }
        .best-info { margin-top: 5px; font-weight: bold; color: #f1c40f; }
    </style>
</head>
<body>

    <div class="ad-area"><iframe id="frame-top" src="ad.html"></iframe></div>

    <div id="game-container">
        <div id="ui">SCORE: 0</div>
        <canvas id="gameCanvas"></canvas>

        <div id="menuScreen">
            <div id="menuHeader">
                <h1 id="menuTitle" style="color:#3498db; margin:0; font-size: 28px;">BLACKHOLE DROP</h1>
                <p style="margin:5px 0; font-size: 14px;">アイテムを吸い込み、爆弾を避けろ！</p>
                <div class="best-info">BEST: <span id="best-ui">0</span></div>
            </div>

            <div id="ad-middle-container">
                <script src="https://adm.shinobi.jp/s/1e6de436ea850948e238e975a93767eb"></script>
            </div>

            <div class="btn-group">
                <button id="goButton">START GAME</button>
                <a href="https://saaaachi.github.io/slime-math2/" class="link-btn">他のゲームはこちら</a>
            </div>
        </div>
    </div>

    <div class="ad-area"><iframe id="frame-bottom" src="ad.html"></iframe></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const ui = document.getElementById("ui");
        const menuScreen = document.getElementById("menuScreen");
        const menuHeader = document.getElementById("menuHeader");
        const menuTitle = document.getElementById("menuTitle");
        const adMid = document.getElementById("ad-middle-container");
        const bestUi = document.getElementById("best-ui");
        const goButton = document.getElementById("goButton");
        const gameContainer = document.getElementById("game-container");

        function resize() {
            canvas.width = gameContainer.clientWidth;
            canvas.height = gameContainer.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0, bestScore = localStorage.getItem("blackhole_drop_best") || 0;
        let gameActive = false, player = { x: 0, y: 0, radius: 35, pull: 75 };
        let items = [], spawnTimer;

        bestUi.innerText = bestScore;

        goButton.onclick = () => {
            menuScreen.style.display = "none";
            adMid.style.display = "none";
            menuHeader.style.display = "block";
            gameContainer.style.backgroundColor = "#34495e";
            gameActive = true;
            score = 0;
            items = [];
            ui.innerText = "SCORE: 0";
            player.x = canvas.width / 2;
            player.y = canvas.height - 65;
            spawnItem();
            update();
        };

        function handleMove(e) {
            if(!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = clientX - rect.left;
            if(player.x < player.radius) player.x = player.radius;
            if(player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
        }

        canvas.addEventListener("touchmove", (e) => { handleMove(e); e.preventDefault(); }, {passive: false});
        canvas.addEventListener("mousemove", handleMove);

        function spawnItem() {
            if(!gameActive) return;
            const isBomb = Math.random() < 0.25;
            const size = isBomb ? 25 : 20;
            items.push({
                x: Math.random() * (canvas.width - size * 2) + size,
                y: -50, size: size, type: isBomb ? "bomb" : "coin",
                speed: 3 + Math.random() * 2 + (score / 150)
            });
            spawnTimer = setTimeout(spawnItem, Math.max(200, 800 - (score * 2)));
        }

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#2980b9";
            ctx.beginPath();
            ctx.ellipse(player.x, player.y, player.radius + 10, player.radius / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#1e374d";
            ctx.beginPath();
            ctx.ellipse(player.x, player.y, player.radius, player.radius / 3, 0, 0, Math.PI * 2);
            ctx.fill();

            for(let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.speed;
                ctx.fillStyle = it.type === "coin" ? "#f1c40f" : "#c0392b";
                ctx.beginPath(); ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2); ctx.fill();
                
                let dx = player.x - it.x, dy = player.y - it.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if(dist < player.pull) {
                    if(it.type === "coin") {
                        score++;
                        ui.innerText = "SCORE: " + score;
                        items.splice(i, 1);
                    } else {
                        gameOver();
                        return;
                    }
                } else if(it.y > canvas.height + 50) {
                    items.splice(i, 1);
                }
            }
            if(gameActive) requestAnimationFrame(update);
        }

        function gameOver() {
            if (!gameActive) return;
            gameActive = false;
            clearTimeout(spawnTimer);

            gameContainer.style.backgroundColor = "#e74c3c";
            
            if(score > bestScore) {
                bestScore = score;
                localStorage.setItem("blackhole_drop_best", bestScore);
                bestUi.innerText = bestScore;
            }
            
            setTimeout(() => {
                menuTitle.innerText = "GAME OVER";
                menuTitle.style.color = "#e74c3c";
                menuHeader.style.display = "none"; 
                goButton.innerText = "RETRY";
                adMid.style.display = "flex"; 
                menuScreen.style.display = "flex";
            }, 100);
        }

        setInterval(() => {
            document.querySelectorAll('iframe').forEach(f => {
                const s = f.src; f.src = "about:blank"; setTimeout(() => f.src = s, 100);
            });
        }, 30000);
    </script>
</body>
</html>
