<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackhole Drop</title>
    <style>
        body { margin: 0; overflow: hidden; background: #2c3e50; font-family: sans-serif; touch-action: none; }
        
        /* 広告エリア：高さを150pxに設定 */
        #ad-top, #ad-bottom { 
            position: fixed; left: 0; width: 100%; height: 150px; 
            background: #333; z-index: 100; display: flex; align-items: center; justify-content: center; 
        }
        #ad-top { top: 0; }
        #ad-bottom { bottom: 0; }
        
        iframe { border: none; width: 100%; height: 150px; }

        /* キャンバス：広告を避けて中央に配置 */
        canvas { display: block; margin-top: 150px; background: #34495e; }
        
        #ui { position: absolute; top: 160px; left: 0; width: 100%; text-align: center; color: #ecf0f1; font-size: 26px; font-weight: bold; pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); z-index: 10; }
        
        #startScreen { 
            position: absolute; top: 150px; left: 0; width: 100%; height: calc(100vh - 300px); 
            background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; color: white;
        }
        #goButton { padding: 15px 45px; font-size: 24px; background: #3498db; border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 4px #2980b9; }
        #best-info { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="ad-top"><iframe id="frame-top" src="ad.html"></iframe></div>
    <div id="ad-bottom"><iframe id="frame-bottom" src="ad.html"></iframe></div>

    <div id="startScreen">
        <h1 style="color:#3498db; margin-bottom:10px;">BLACKHOLE DROP</h1>
        <p style="margin-bottom: 25px;">落ちてくるアイテムを吸い込め！<br>爆弾は避けろ！</p>
        <button id="goButton">START GAME</button>
        <p id="best-info">BEST SCORE: <span id="best-ui">0</span></p>
    </div>

    <div id="ui">SCORE: 0</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const ui = document.getElementById("ui");
        const startScreen = document.getElementById("startScreen");
        const goButton = document.getElementById("goButton");
        const bestUi = document.getElementById("best-ui");

        // キャンバスサイズ設定（上下150pxずつ引く）
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 300;

        let score = 0;
        let bestScore = localStorage.getItem("blackhole_drop_best") || 0;
        let gameActive = false;
        let player = { x: canvas.width / 2, y: canvas.height - 70, radius: 35, pull: 80 }; // pull: 吸い込み範囲
        let items = []; // 落ちてくるアイテム（コインや爆弾）
        bestUi.innerText = bestScore;

        goButton.onclick = () => {
            startScreen.style.display = "none";
            gameActive = true;
            score = 0;
            items = [];
            ui.innerText = "SCORE: 0";
            spawnItem();
            update();
        };

        // 操作：スライドでUFOを動かす
        function handleMove(e) {
            if(!gameActive) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = clientX;
            // 画面外防止
            if(player.x < player.radius) player.x = player.radius;
            if(player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
        }

        window.addEventListener("touchmove", (e) => { handleMove(e); e.preventDefault(); }, {passive: false});
        window.addEventListener("mousemove", handleMove);

        function spawnItem() {
            if(!gameActive) return;
            const isBomb = Math.random() < 0.25; // 25%の確率で爆弾
            const size = isBomb ? 25 : 20; // 爆弾は少し大きい
            items.push({
                x: Math.random() * (canvas.width - size * 2) + size,
                y: -50,
                size: size,
                type: isBomb ? "bomb" : "coin",
                speed: 3 + Math.random() * 2 + (score / 150) // スコアに応じて加速
            });
            // 出現間隔を徐々に短く
            let interval = Math.max(200, 800 - (score / 2));
            setTimeout(spawnItem, interval);
        }

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ブラックホールUFO描画
            ctx.fillStyle = "#2980b9";
            ctx.beginPath();
            ctx.ellipse(player.x, player.y, player.radius + 10, player.radius / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#1e374d"; // ブラックホール本体（楕円）
            ctx.beginPath();
            ctx.ellipse(player.x, player.y, player.radius, player.radius / 3, 0, 0, Math.PI * 2);
            ctx.fill();

            for(let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.speed;

                // アイテム描画
                if(it.type === "coin") {
                    ctx.fillStyle = "#f1c40f";
                    ctx.beginPath(); ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2); ctx.fill();
                } else { // Bomb
                    ctx.fillStyle = "#c0392b";
                    ctx.beginPath(); ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = "#e74c3c"; // 導火線
                    ctx.fillRect(it.x - 2, it.y - it.size - 5, 4, 10);
                }

                // 吸い込み判定（ブラックホールの「pull」範囲）
                let dx = player.x - it.x;
                let dy = player.y - it.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if(dist < player.pull) { // 吸い込み範囲に入ったら
                    if(it.type === "coin") {
                        score++;
                        ui.innerText = "SCORE: " + score;
                        items.splice(i, 1);
                    } else { // 爆弾を吸い込んだ
                        gameOver();
                        return;
                    }
                } else if(it.y > canvas.height + 50) { // 画面外に落ちたら
                    items.splice(i, 1);
                }
            }
            requestAnimationFrame(update);
        }

        function gameOver() {
            gameActive = false;
            if(score > bestScore) {
                bestScore = score;
                localStorage.setItem("blackhole_drop_best", bestScore);
            }
            alert("GAME OVER!\nSCORE: " + score);
            location.reload();
        }

        // 🚀 30秒ごとに広告を転生（強制リフレッシュ）
        setInterval(() => {
            ["frame-top", "frame-bottom"].forEach(id => {
                const f = document.getElementById(id);
                if(f) {
                    const s = f.src; f.src = "about:blank";
                    setTimeout(() => f.src = s, 100);
                }
            });
        }, 29000);
    </script>
</body>
</html>
