<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackhole Drop - Max Revenue</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1299640300068792" crossorigin="anonymous"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #0f172a; font-family: sans-serif;
            position: fixed;
        }

        /* 上部広告：100px固定 */
        #ad-top-container { position: fixed; top: 0; left: 0; width: 100%; height: 100px; background: #000; z-index: 9999; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        /* ゲームエリア：下まで突き抜ける */
        #game-outer {
            position: absolute; top: 100px; bottom: 0; left: 0; right: 0;
            background: #1e293b; overflow: hidden; z-index: 10;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* メニュー/リザルト画面 */
        #menuScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98); z-index: 50;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 10px;
        }

        #menuHeader { text-align: center; margin-bottom: 5px; }
        #menuTitle { color: #38bdf8; margin: 0; font-size: 28px; }
        .best-info { font-weight: bold; color: #fbbf24; font-size: 18px; }

        /* リザルト用 300x250 広告枠 */
        #mid-ad-box {
            width: 300px; height: 250px; background: #000; margin: 15px 0;
            display: none; justify-content: center; align-items: center;
            border-radius: 10px; overflow: hidden; border: 1px solid #334155;
        }

        /* 5秒全画面広告 */
        #inter-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 99999; align-items: center; justify-content: center; }
        .inter-content { width: 330px; height: 330px; background: #fff; position: relative; border-radius: 8px; }
        #close-ad-btn { position: absolute; top: -50px; right: 0px; width: 45px; height: 45px; background: #333; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; border: 2px solid #fff; cursor: pointer; }

        .btn-group { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 12px; }
        .menu-btn { padding: 15px 0; font-size: 18px; border: none; border-radius: 50px; color: white; font-weight: bold; cursor: pointer; text-decoration: none; width: 260px; text-align: center; transition: 0.2s; }
        #goButton { background: #38bdf8; box-shadow: 0 4px #0284c7; }
        #goButton:disabled { background: #475569; box-shadow: none; opacity: 0.7; cursor: default; }
        .link-btn { background: #a855f7; box-shadow: 0 4px #9333ea; }
    </style>
</head>
<body>

    <div id="ad-top-container">
        <ins class="adsbygoogle" style="display:inline-block;width:320px;height:100px" data-ad-client="ca-pub-1299640300068792" data-ad-slot="3972022911"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <div id="game-outer">
        <div id="ui" style="position:absolute; top:10px; width:100%; text-align:center; color:white; font-weight:bold; pointer-events:none; z-index:20; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">SCORE: 0</div>
        <canvas id="gameCanvas"></canvas>

        <div id="menuScreen">
            <div id="menuHeader">
                <h1 id="menuTitle">BLACKHOLE DROP</h1>
                <div class="best-info">BEST: <span id="best-ui">0</span></div>
            </div>

            <div id="mid-ad-box">
                <ins class="adsbygoogle"
                     style="display:inline-block;width:300px;height:250px"
                     data-ad-client="ca-pub-1299640300068792"
                     data-ad-slot="9050127185"></ins>
                <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
            </div>

            <div class="btn-group">
                <button id="goButton" class="menu-btn">START GAME</button>
                <a href="https://saaaachi.github.io/" class="menu-btn link-btn">他のゲームへ</a>
            </div>
        </div>
    </div>

    <div id="inter-screen">
        <div class="inter-content">
            <div id="close-ad-btn" onclick="closeAd()">5</div>
            <iframe id="ifr-inter" src="about:blank" style="width:100%; height:100%; border:none; border-radius:8px; background: #fff;"></iframe>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const menuScreen = document.getElementById("menuScreen");
        const menuTitle = document.getElementById("menuTitle");
        const bestUi = document.getElementById("best-ui");
        const goButton = document.getElementById("goButton");
        const gameOuter = document.getElementById("game-outer");
        const scoreUi = document.getElementById("ui");
        const adMid = document.getElementById("mid-ad-box");

        function resize() {
            canvas.width = gameOuter.clientWidth;
            canvas.height = gameOuter.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0, bestScore = localStorage.getItem("blackhole_drop_best") || 0;
        let gameActive = false, player = { x: 0, y: 0, radius: 35, pull: 75 };
        let items = [], spawnTimer, playCount = 0;
        bestUi.innerText = bestScore;

        goButton.onclick = () => {
            menuScreen.style.display = "none"; adMid.style.display = "none";
            gameOuter.style.backgroundColor = "#1e293b";
            gameActive = true; score = 0; items = [];
            scoreUi.innerText = "SCORE: 0";
            player.x = canvas.width / 2;
            player.y = canvas.height - 65;
            spawnItem(); update();
        };

        function handleMove(e) {
            if(!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = clientX - rect.left;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        }

        canvas.addEventListener("touchmove", (e) => { e.preventDefault(); handleMove(e); }, {passive: false});
        canvas.addEventListener("mousemove", handleMove);

        function spawnItem() {
            if(!gameActive) return;
            items.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -50, size: Math.random() < 0.25 ? 25 : 20, type: Math.random() < 0.25 ? "bomb" : "coin",
                speed: 3 + Math.random() * 2 + (score / 100)
            });
            spawnTimer = setTimeout(spawnItem, Math.max(200, 800 - (score * 2)));
        }

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // ブラックホール（プレイヤー）
            ctx.fillStyle = "#38bdf8";
            ctx.beginPath(); ctx.ellipse(player.x, player.y, player.radius + 10, player.radius / 2, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#0f172a";
            ctx.beginPath(); ctx.ellipse(player.x, player.y, player.radius, player.radius / 3, 0, 0, Math.PI * 2); ctx.fill();

            for(let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.speed;
                ctx.fillStyle = it.type === "coin" ? "#fbbf24" : "#ef4444";
                ctx.beginPath(); ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2); ctx.fill();
                
                let dx = player.x - it.x, dy = player.y - it.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if(dist < player.pull) {
                    if(it.type === "coin") {
                        score++; scoreUi.innerText = "SCORE: " + score; items.splice(i, 1);
                    } else { gameOver(); return; }
                } else if(it.y > canvas.height + 50) { items.splice(i, 1); }
            }
            if(gameActive) requestAnimationFrame(update);
        }

        function gameOver() {
            if (!gameActive) return;
            gameActive = false; playCount++;
            clearTimeout(spawnTimer);
            gameOuter.style.backgroundColor = "#7f1d1d";
            
            if(score > bestScore) {
                bestScore = score;
                localStorage.setItem("blackhole_drop_best", bestScore);
                bestUi.innerText = bestScore;
            }
            
            menuTitle.innerText = "GAME OVER";
            goButton.innerText = "お待ちください...";
            goButton.disabled = true;
            adMid.style.display = "flex";
            menuScreen.style.display = "flex";

            // 1.5秒後にリトライボタン有効
            setTimeout(() => { goButton.disabled = false; goButton.innerText = "RETRY"; }, 1500);

            // 2回目、5回目、8回目…
            if (playCount === 2 || (playCount >= 5 && (playCount - 2) % 3 === 0)) {
                setTimeout(showLargeAd, 500);
            }
        }

        function showLargeAd() {
            const screen = document.getElementById("inter-screen"), closeBtn = document.getElementById("close-ad-btn"), ifr = document.getElementById('ifr-inter');
            ifr.src = './ad.large.html?v=' + Date.now();
            screen.style.display = "flex";
            let timer = 5;
            closeBtn.innerText = timer; closeBtn.style.pointerEvents = "none"; closeBtn.style.background = "#555";
            const countdown = setInterval(() => {
                timer--;
                if (timer > 0) closeBtn.innerText = timer;
                else {
                    clearInterval(countdown);
                    closeBtn.innerText = "×";
                    closeBtn.style.background = "#ff4444";
                    closeBtn.style.pointerEvents = "auto";
                }
            }, 1000);
        }

        function closeAd() {
            document.getElementById("inter-screen").style.display = "none";
            document.getElementById('ifr-inter').src = 'about:blank';
        }
    </script>
</body>
</html>
