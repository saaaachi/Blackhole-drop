<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackhole Drop v3.2</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #1a252f; font-family: sans-serif;
            position: fixed;
        }

        /* 上の広告（150px） */
        #ad-top {
            position: absolute; top: 0; left: 0; width: 100%; height: 150px;
            background: #000; z-index: 1000;
        }

        /* 下の広告：最下部に配置してPR広告の裏に潜り込ませる */
        #ad-bottom {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100px;
            background: #000; z-index: 1; /* 重なり順を低くする */
        }

        /* ゲームエリア：下までしっかり広げる */
        #game-outer {
            position: absolute;
            top: 150px; bottom: 60px; /* PR広告の高さ分だけ空ける */
            left: 0; right: 0;
            background: #34495e; overflow: hidden; z-index: 10;
        }

        canvas { display: block; width: 100%; height: 100%; }
        iframe { border: none; width: 100%; height: 100%; }

        /* メニュー画面 */
        #menuScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 50;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center;
        }

        #menuHeader { text-align: center; margin-bottom: 10px; }
        #menuTitle { color: #3498db; margin: 0; font-size: 24px; }
        .best-info { font-weight: bold; color: #f1c40f; font-size: 18px; }

        /* 中央広告（ゲームオーバー時のみ） */
        #ad-middle-container {
            width: 300px; height: 250px; background: #000;
            margin: 15px 0; display: none;
            justify-content: center; align-items: center;
        }
        
        /* ボタン群 */
        .btn-group {
            display: flex; flex-direction: column; align-items: center;
            width: 100%;
        }

        #goButton {
            padding: 12px 0; font-size: 18px; background: #3498db; border: none;
            border-radius: 50px; color: white; font-weight: bold; cursor: pointer;
            width: 240px; margin-bottom: 10px;
        }
        .link-btn {
            padding: 10px 0; font-size: 14px; background: #9b59b6;
            border: none; border-radius: 50px; color: white; font-weight: bold;
            text-decoration: none; width: 240px; text-align: center;
        }
    </style>
</head>
<body>

    <div id="ad-top"><iframe src="ad.html"></iframe></div>

    <div id="game-outer">
        <div id="ui" style="position:absolute; top:10px; width:100%; text-align:center; color:white; font-weight:bold; pointer-events:none; z-index:20;">SCORE: 0</div>
        <canvas id="gameCanvas"></canvas>

        <div id="menuScreen">
            <div id="menuHeader">
                <h1 id="menuTitle">BLACKHOLE DROP</h1>
                <div class="best-info">BEST: <span id="best-ui">0</span></div>
            </div>

            <div id="ad-middle-container">
                <script src="https://adm.shinobi.jp/s/1e6de436ea850948e238e975a93767eb"></script>
            </div>

            <div class="btn-group">
                <button id="goButton">START GAME</button>
                <a href="https://saaaachi.github.io/slime-math2/" class="link-btn">他のゲームはこちら</a>
            </div>
        </div>
    </div>

    <div id="ad-bottom"><iframe src="ad.html"></iframe></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const menuScreen = document.getElementById("menuScreen");
        const menuTitle = document.getElementById("menuTitle");
        const adMid = document.getElementById("ad-middle-container");
        const bestUi = document.getElementById("best-ui");
        const goButton = document.getElementById("goButton");
        const gameOuter = document.getElementById("game-outer");
        const scoreUi = document.getElementById("ui");

        function resize() {
            canvas.width = gameOuter.clientWidth;
            canvas.height = gameOuter.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0, bestScore = localStorage.getItem("blackhole_drop_best") || 0;
        let gameActive = false, player = { x: 0, y: 0, radius: 35, pull: 75 };
        let items = [], spawnTimer;
        bestUi.innerText = bestScore;

        goButton.onclick = () => {
            menuScreen.style.display = "none";
            gameOuter.style.backgroundColor = "#34495e";
            gameActive = true;
            score = 0; items = [];
            scoreUi.innerText = "SCORE: 0";
            player.x = canvas.width / 2;
            player.y = canvas.height - 65;
            spawnItem(); update();
        };

        function handleMove(e) {
            if(!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = clientX - rect.left;
            if(player.x < player.radius) player.x = player.radius;
            if(player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
        }

        canvas.addEventListener("touchmove", (e) => { e.preventDefault(); handleMove(e); }, {passive: false});
        canvas.addEventListener("mousemove", handleMove);

        function spawnItem() {
            if(!gameActive) return;
            items.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -50, size: Math.random() < 0.25 ? 25 : 20, type: Math.random() < 0.25 ? "bomb" : "coin",
                speed: 3 + Math.random() * 2 + (score / 150)
            });
            spawnTimer = setTimeout(spawnItem, Math.max(200, 800 - (score * 2)));
        }

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#2980b9";
            ctx.beginPath(); ctx.ellipse(player.x, player.y, player.radius + 10, player.radius / 2, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#1e374d";
            ctx.beginPath(); ctx.ellipse(player.x, player.y, player.radius, player.radius / 3, 0, 0, Math.PI * 2); ctx.fill();

            for(let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.speed;
                ctx.fillStyle = it.type === "coin" ? "#f1c40f" : "#c0392b";
                ctx.beginPath(); ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2); ctx.fill();
                let dx = player.x - it.x, dy = player.y - it.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if(dist < player.pull) {
                    if(it.type === "coin") {
                        score++; scoreUi.innerText = "SCORE: " + score; items.splice(i, 1);
                    } else { gameOver(); return; }
                } else if(it.y > canvas.height + 50) { items.splice(i, 1); }
            }
            if(gameActive) requestAnimationFrame(update);
        }

        function gameOver() {
            if (!gameActive) return;
            gameActive = false;
            clearTimeout(spawnTimer);
            gameOuter.style.backgroundColor = "#e74c3c";
            if(score > bestScore) {
                bestScore = score;
                localStorage.setItem("blackhole_drop_best", bestScore);
                bestUi.innerText = bestScore;
            }
            menuTitle.innerText = "GAME OVER";
            goButton.innerText = "RETRY";
            adMid.style.display = "flex"; 
            menuScreen.style.display = "flex";
        }

        setInterval(() => {
            document.querySelectorAll('iframe').forEach(f => {
                const s = f.src; f.src = "about:blank"; setTimeout(() => f.src = s, 100);
            });
        }, 30000);
    </script>
</body>
</html>
