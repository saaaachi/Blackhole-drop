<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackhole Drop v3.3 - Ad Deluxe</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #1a252f; font-family: sans-serif;
            position: fixed;
        }

        /* 広告枠 */
        #ad-top, #ad-bottom {
            position: absolute; left: 0; width: 100%; height: 100px;
            background: #000; z-index: 1000;
        }
        #ad-top { top: 0; }
        #ad-bottom { bottom: 0; }

        /* ゲームエリア */
        #game-outer {
            position: absolute; top: 100px; bottom: 100px; left: 0; right: 0;
            background: #34495e; overflow: hidden; z-index: 10;
        }

        canvas { display: block; width: 100%; height: 100%; }
        iframe { border: none; width: 100%; height: 100%; }

        /* メニュー/リザルト画面 */
        #menuScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 50;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; padding-top: 20px;
        }

        #menuHeader { text-align: center; margin-bottom: 10px; }
        #menuTitle { color: #3498db; margin: 0; font-size: 28px; }
        .best-info { font-weight: bold; color: #f1c40f; font-size: 18px; }

        /* リザルト用の中サイズ広告エリア */
        #mid-ad-box {
            width: 300px; height: 250px; background: #222; margin: 15px 0;
            display: flex; align-items: center; justify-content: center;
        }

        /* 大広告オーバーレイ */
        #bigAdScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2000;
            display: none; justify-content: center; align-items: center;
        }
        .ad-frame-wrapper { width: 90%; height: 80%; position: relative; }
        .ad-close-btn { 
            position: absolute; top: -10px; right: -10px; color: white; font-size: 30px; 
            font-weight: bold; cursor: pointer; background: rgba(0,0,0,0.5); 
            width: 40px; height: 40px; border-radius: 50%; display: none;
            align-items: center; justify-content: center; z-index: 2100;
        }
        
        .btn-group { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 12px; }
        #goButton {
            padding: 15px 0; font-size: 20px; background: #3498db; border: none;
            border-radius: 50px; color: white; font-weight: bold; cursor: pointer;
            width: 240px; box-shadow: 0 4px #2980b9; transition: opacity 0.3s;
        }
        #goButton:disabled { background: #7f8c8d; box-shadow: 0 4px #95a5a6; opacity: 0.6; cursor: default; }
        
        .link-btn {
            padding: 12px 0; font-size: 16px; background: #9b59b6;
            border: none; border-radius: 50px; color: white; font-weight: bold;
            text-decoration: none; width: 240px; text-align: center;
            box-shadow: 0 4px #8e44ad;
        }
    </style>
</head>
<body>

    <div id="ad-top"><iframe id="ifr-top" src="ad.html?pos=top"></iframe></div>

    <div id="game-outer">
        <div id="ui" style="position:absolute; top:10px; width:100%; text-align:center; color:white; font-weight:bold; pointer-events:none; z-index:20;">SCORE: 0</div>
        <canvas id="gameCanvas"></canvas>

        <div id="menuScreen">
            <div id="menuHeader">
                <h1 id="menuTitle">BLACKHOLE DROP</h1>
                <div class="best-info">BEST: <span id="best-ui">0</span></div>
            </div>

            <div id="mid-ad-box">
                <div id="im-8b988d7b042a42d5b8df6921b628cf00">
                    <script async src="https://imp-adedge.i-mobile.co.jp/script/v1/spot.js?20220104"></script>
                    <script>(window.adsbyimobile=window.adsbyimobile||[]).push({pid:84561,mid:590804,asid:1924211,type:"banner",display:"inline",elementid:"im-8b988d7b042a42d5b8df6921b628cf00"})</script>
                </div>
            </div>

            <div class="btn-group">
                <button id="goButton">START GAME</button>
                <a href="https://saaaachi.github.io/" class="link-btn">他のゲームはこちら</a>
            </div>
        </div>

        <div id="bigAdScreen">
            <div class="ad-frame-wrapper">
                <div id="ad-close-btn" class="ad-close-btn" onclick="closeAd()">×</div>
                <iframe id="ad-large-frame" src="" style="width:100%; height:100%; border:none;"></iframe>
            </div>
        </div>
    </div>

    <div id="ad-bottom"><iframe id="ifr-bottom" src="ad.html?pos=bottom"></iframe></div>

    <script>
        // --- 広告自動更新 ---
        setInterval(() => {
            const now = Date.now();
            document.getElementById('ifr-top').src = 'ad.html?pos=top&t=' + now;
            document.getElementById('ifr-bottom').src = 'ad.html?pos=bottom&t=' + now;
        }, 30000);

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const menuScreen = document.getElementById("menuScreen");
        const menuTitle = document.getElementById("menuTitle");
        const bestUi = document.getElementById("best-ui");
        const goButton = document.getElementById("goButton");
        const gameOuter = document.getElementById("game-outer");
        const scoreUi = document.getElementById("ui");

        function resize() {
            canvas.width = gameOuter.clientWidth;
            canvas.height = gameOuter.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0, bestScore = localStorage.getItem("blackhole_drop_best") || 0;
        let gameActive = false, player = { x: 0, y: 0, radius: 35, pull: 75 };
        let items = [], spawnTimer, playCount = 0;
        bestUi.innerText = bestScore;

        goButton.onclick = () => {
            menuScreen.style.display = "none";
            gameOuter.style.backgroundColor = "#34495e";
            gameActive = true;
            score = 0; items = [];
            scoreUi.innerText = "SCORE: 0";
            player.x = canvas.width / 2;
            player.y = canvas.height - 65;
            spawnItem(); update();
        };

        function handleMove(e) {
            if(!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = clientX - rect.left;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        }

        canvas.addEventListener("touchmove", (e) => { e.preventDefault(); handleMove(e); }, {passive: false});
        canvas.addEventListener("mousemove", handleMove);

        function spawnItem() {
            if(!gameActive) return;
            items.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -50, size: Math.random() < 0.25 ? 25 : 20, type: Math.random() < 0.25 ? "bomb" : "coin",
                speed: 3 + Math.random() * 2 + (score / 150)
            });
            spawnTimer = setTimeout(spawnItem, Math.max(200, 800 - (score * 2)));
        }

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // プレイヤー描画
            ctx.fillStyle = "#2980b9";
            ctx.beginPath(); ctx.ellipse(player.x, player.y, player.radius + 10, player.radius / 2, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#1e374d";
            ctx.beginPath(); ctx.ellipse(player.x, player.y, player.radius, player.radius / 3, 0, 0, Math.PI * 2); ctx.fill();

            for(let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.speed;
                ctx.fillStyle = it.type === "coin" ? "#f1c40f" : "#c0392b";
                ctx.beginPath(); ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2); ctx.fill();
                
                let dx = player.x - it.x, dy = player.y - it.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if(dist < player.pull) {
                    if(it.type === "coin") {
                        score++; scoreUi.innerText = "SCORE: " + score; items.splice(i, 1);
                    } else { gameOver(); return; }
                } else if(it.y > canvas.height + 50) { items.splice(i, 1); }
            }
            if(gameActive) requestAnimationFrame(update);
        }

        function gameOver() {
            if (!gameActive) return;
            gameActive = false;
            playCount++;
            clearTimeout(spawnTimer);
            gameOuter.style.backgroundColor = "#e74c3c";
            
            if(score > bestScore) {
                bestScore = score;
                localStorage.setItem("blackhole_drop_best", bestScore);
                bestUi.innerText = bestScore;
            }
            
            menuTitle.innerText = "GAME OVER";
            goButton.innerText = "お待ちください...";
            goButton.disabled = true;
            
            // 大広告の判定
            if (playCount === 2 || (playCount > 2 && (playCount - 2) % 5 === 0)) {
                showBigAd();
            } else {
                menuScreen.style.display = "flex";
                // リトライボタンを少し遅れて表示（広告を見せる）
                setTimeout(() => {
                    goButton.disabled = false;
                    goButton.innerText = "RETRY";
                }, 1500);
            }
        }

        function showBigAd() {
            const screen = document.getElementById("bigAdScreen");
            const closeBtn = document.getElementById("ad-close-btn");
            const frame = document.getElementById("ad-large-frame");
            frame.src = "ad.large.html?t=" + Date.now();
            screen.style.display = "flex";
            closeBtn.style.display = "none";
            setTimeout(() => { closeBtn.style.display = "flex"; }, 5000);
        }

        function closeAd() {
            document.getElementById("bigAdScreen").style.display = "none";
            document.getElementById("ad-large-frame").src = "";
            menuScreen.style.display = "flex";
            setTimeout(() => {
                goButton.disabled = false;
                goButton.innerText = "RETRY";
            }, 500);
        }
    </script>
</body>
</html>
