<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackhole Drop v2.4</title>
    <style>
        /* 画面全体のスクロールとバウンスを完全に殺す */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #1a252f; font-family: sans-serif;
            position: fixed; top: 0; left: 0;
        }

        /* 150pxの壁（上） */
        #ad-top {
            position: absolute; top: 0; left: 0; width: 100%; height: 150px;
            background: #000; z-index: 100;
        }

        /* ゲームエリア：上下150pxを絶対に空ける */
        #game-outer {
            position: absolute;
            top: 150px; bottom: 150px; left: 0; right: 0;
            background: #34495e; overflow: hidden; z-index: 10;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* UI（スコア） */
        #ui {
            position: absolute; top: 10px; left: 0; width: 100%;
            text-align: center; color: #ecf0f1; font-size: 24px; font-weight: bold;
            pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); z-index: 20;
        }

        /* メニュー画面 */
        #menuScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; z-index: 50; color: white;
            padding-top: 20px;
        }

        /* 真ん中の広告枠：遅れても動かないように高さを「予約」 */
        #ad-middle-container {
            width: 300px; height: 250px; background: #000;
            display: flex; justify-content: center; align-items: center;
            margin: 10px 0; border: 1px solid #333; flex-shrink: 0;
        }
        
        /* ボタンエリア：下の広告から距離を置く */
        .btn-group {
            display: flex; flex-direction: column; align-items: center;
            margin-top: auto; /* 一番下へ */
            margin-bottom: 30px; /* 下広告との絶対的な距離 */
        }

        #goButton {
            padding: 15px 40px; font-size: 22px; background: #3498db; border: none;
            border-radius: 50px; color: white; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px #2980b9; width: 260px; margin-bottom: 15px;
        }
        .link-btn {
            padding: 12px 0; font-size: 16px; background: #9b59b6;
            border: none; border-radius: 50px; color: white; font-weight: bold;
            text-decoration: none; width: 260px; text-align: center;
            box-shadow: 0 4px #8e44ad;
        }

        /* 150pxの壁（下） */
        #ad-bottom {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 150px;
            background: #000; z-index: 100;
        }
        iframe { border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="ad-top"><iframe src="ad.html"></iframe></div>

    <div id="game-outer">
        <div id="ui">SCORE: 0</div>
        <canvas id="gameCanvas"></canvas>

        <div id="menuScreen">
            <div id="menuHeader" style="text-align: center;">
                <h1 id="menuTitle" style="color:#3498db; margin:0; font-size: 24px;">BLACKHOLE DROP</h1>
                <div style="font-weight: bold; color: #f1c40f; margin-top: 5px;">BEST: <span id="best-ui">0</span></div>
            </div>

            <div id="ad-middle-container">
                <script src="https://adm.shinobi.jp/s/1e6de436ea850948e238e975a93767eb"></script>
            </div>

            <div class="btn-group">
                <button id="goButton">START GAME</button>
                <a href="" class="link-btn">他のゲームはこちら</a>
            </div>
        </div>
    </div>

    <div id="ad-bottom"><iframe src="ad.html"></iframe></div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const ui = document.getElementById("ui");
        const menuScreen = document.getElementById("menuScreen");
        const menuTitle = document.getElementById("menuTitle");
        const adMid = document.getElementById("ad-middle-container");
        const bestUi = document.getElementById("best-ui");
        const goButton = document.getElementById("goButton");
        const gameOuter = document.getElementById("game-outer");

        function resize() {
            canvas.width = gameOuter.clientWidth;
            canvas.height = gameOuter.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0, bestScore = localStorage.getItem("blackhole_drop_best") || 0;
        let gameActive = false, player = { x: 0, y: 0, radius: 35, pull: 75 };
        let items = [], spawnTimer;

        bestUi.innerText = bestScore;

        goButton.onclick = () => {
            menuScreen.style.display = "none";
            gameOuter.style.backgroundColor = "#34495e";
            gameActive = true;
            score = 0;
            items = [];
            ui.innerText = "SCORE: 0";
            player.x = canvas.width / 2;
            player.y = canvas.height - 65;
            spawnItem();
            update();
        };

        function handleMove(e) {
            if(!gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = clientX - rect.left;
            if(player.x < player.radius) player.x = player.radius;
            if(player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
        }

        canvas.addEventListener("touchmove", (e) => { e.preventDefault(); handleMove(e); }, {passive: false});
        canvas.addEventListener("mousemove", handleMove);

        function spawnItem() {
            if(!gameActive) return;
            const isBomb = Math.random() < 0.25;
            items.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -50, size: isBomb ? 25 : 20, type: isBomb ? "bomb" : "coin",
                speed: 3 + Math.random() * 2 + (score / 150)
            });
            spawnTimer = setTimeout(spawnItem, Math.max(200, 800 - (score * 2)));
        }

        function update() {
            if(!gameActive) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // UFO
            ctx.fillStyle = "#2980b9";
            ctx.beginPath();
            ctx.ellipse(player.x, player.y, player.radius + 10, player.radius / 2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#1e374d";
            ctx.beginPath();
            ctx.ellipse(player.x, player.y, player.radius, player.radius / 3, 0, 0, Math.PI * 2);
            ctx.fill();

            for(let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.speed;
                ctx.fillStyle = it.type === "coin" ? "#f1c40f" : "#c0392b";
                ctx.beginPath(); ctx.arc(it.x, it.y, it.size, 0, Math.PI * 2); ctx.fill();
                
                let dx = player.x - it.x, dy = player.y - it.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                if(dist < player.pull) {
                    if(it.type === "coin") {
                        score++;
                        ui.innerText = "SCORE: " + score;
                        items.splice(i, 1);
                    } else {
                        gameOver();
                        return;
                    }
                } else if(it.y > canvas.height + 50) {
                    items.splice(i, 1);
                }
            }
            if(gameActive) requestAnimationFrame(update);
        }

        function gameOver() {
            if (!gameActive) return;
            gameActive = false;
            clearTimeout(spawnTimer);
            gameOuter.style.backgroundColor = "#e74c3c";
            
            if(score > bestScore) {
                bestScore = score;
                localStorage.setItem("blackhole_drop_best", bestScore);
                bestUi.innerText = bestScore;
            }
            
            setTimeout(() => {
                menuTitle.innerText = "GAME OVER";
                menuTitle.style.color = "#e74c3c";
                goButton.innerText = "RETRY";
                menuScreen.style.display = "flex";
            }, 100);
        }

        // 広告リフレッシュ
        setInterval(() => {
            document.querySelectorAll('#ad-top iframe, #ad-bottom iframe').forEach(f => {
                const s = f.src; f.src = "about:blank"; setTimeout(() => f.src = s, 100);
            });
        }, 30000);
    </script>
</body>
</html>
